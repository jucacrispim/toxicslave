language: python

versions:
  - '3.11'
  - '3.12'
  - '3.13'

extra_indexes:
  - 'https://pypi.poraodojuca.dev'

system_packages:
  - procps
  - make
  - git
  - curl

steps:
  - name: Linter checks
    command: ./scripts/run_linter.sh

  - name: Code complexity checks
    command: xenon toxicbuild -b B

  - name: Unit tests & coverage
    command: ./scripts/check_coverage.sh

  - name: Functional tests
    command: pytest tests/functional

  - name: Release
    command: ./scripts/release.sh

  - name: Build docs
    command: ./scripts/build_docs.sh

  - name: Upload docs
    command: ./scripts/upload_docs.sh


builders:
  - name: Docs & Release
    branches:
      - release

    platform: python3.13

    envvars:
      ENV: ci

    plugins:
      - name: apt-install
        packages:
          - build-essential
          - curl

      - name: python-venv
        pyversion: python3.13
        extra_indexes:
          - 'https://pypi.poraodojuca.dev'

    steps:
      - name: Build docs
        command: ./scripts/build_docs.sh
        stop_on_fail: true

      - name: upload docs to pdj pypi
        command: ./scripts/release.sh

      - name: upload docs
        command: ./scripts/upload_docs.sh
